# Kaaf Website - Production Deployment Pipeline
name: Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application to Server
    runs-on: ubuntu-latest
    environment: Kaaf-Website Secrets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROJECT_PATH: ${{ secrets.PROD_PROJECT_PATH }}
        with:
          envs: PROJECT_PATH
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m
          timeout: 120s
          script: |
            set -e
            echo "🚀 Starting production deployment..."
            cd "$PROJECT_PATH"

            echo "📦 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            # Stop and remove any legacy or existing container occupying port 3003
            echo "🔄 Rebuilding and restarting containers..."
            docker rm -f kaaf-website || true
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # Check status
            echo "📊 Container Status:"
            docker compose -f docker-compose.prod.yml ps

            echo "✅ Deployment complete! ---)> PROD"
